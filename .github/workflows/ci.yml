name: Continuous Integration & Verification

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-frontend:
    name: Lint, Test & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'wellness-app/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd wellness-app
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd wellness-app
          npm run typecheck

      - name: Run Unit Tests
        run: |
          cd wellness-app
          npm run test

      - name: Build Production Frontend
        run: |
          cd wellness-app
          npm run build

  validate-functions:
    name: Build & Typecheck Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm ci

      - name: Compile Cloud Functions TypeScript
        run: |
          cd functions
          npm run build
